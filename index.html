<!DOCTYPE html>
<html lang="zh-CN"><head>

<body>

<div class="top-bar">
  <div class="top-bar-left">
    <span class="app-name">智能外呼</span>
  </div>
  <div class="breadcrumb" id="breadcrumb"><span class="bc-current">首页</span></div>
  <div class="right-area">
    <a href="docs/功能说明文档.html" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:#fff;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;color:#333;text-decoration:none;cursor:pointer;" onmouseover="this.style.borderColor='#1677ff';this.style.color='#1677ff'" onmouseout="this.style.borderColor='#d9d9d9';this.style.color='#333'">📖 功能说明文档</a>
    <a href="docs/计算逻辑.html" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;background:#fff;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;color:#333;text-decoration:none;cursor:pointer;" onmouseover="this.style.borderColor='#1677ff';this.style.color='#1677ff'" onmouseout="this.style.borderColor='#d9d9d9';this.style.color='#333'">📐 计算逻辑</a>
    <div class="user-dropdown-wrap" id="userDropdownWrap">
      <div class="user-role-trigger" id="userRoleTrigger" onclick="window.toggleUserMenu(event)">
        <span class="user-icon">👤</span>
        <span class="user-name">产品-超管</span>
      </div>
      <div class="user-dropdown-menu" id="userDropdownMenu">
        <div class="user-dropdown-item" onclick="window.showAccountInfoModal()">
          <span class="user-item-icon">🔧</span>
          <span class="user-item-text">账号信息</span>
        </div>
        <div class="user-dropdown-item" onclick="window.doLogout()">
          <span class="user-item-icon">🚪</span>
          <span class="user-item-text">退出登录</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="main-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg width="20" height="20" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">
        <path d="M64 12L116 64L64 116L12 64L64 12Z" stroke="#1677ff" stroke-width="12" fill="none"></path>
        <path d="M64 36L92 64L64 92L36 64L64 36Z" fill="#ff4d4f"></path>
      </svg>
      <span class="logo-text">智能外呼</span>
    </div>

    <div class="nav-item" id="nav-home" onclick="window.Nav.setActive(this)">
      <div class="nav-item-inner"><span class="label">首页</span></div>
    </div>

    <div class="nav-item" id="nav-scene" onclick="window.Nav.toggleMenu(this,'scene')">
      <div class="nav-item-inner"><span class="label">外呼场景</span></div>
      <span class="arrow">▾</span>
    </div>
    <div class="nav-sub" id="sub-scene">
      <div class="nav-sub-item" id="scene-list" onclick="window.Nav.selectSubMenu(this,'外呼列表')">外呼列表</div>
      <div class="nav-sub-item" id="scene-block" onclick="window.Nav.selectSubMenu(this,'外呼拦截')">外呼拦截</div>
    </div>

    <div class="nav-item" id="nav-report" onclick="window.Nav.toggleMenu(this,'report')">
      <div class="nav-item-inner"><span class="label">统计分析</span></div>
      <span class="arrow">▾</span>
    </div>
    <div class="nav-sub" id="sub-report">
      <div class="nav-sub-item" id="report-call" onclick="window.Nav.selectSubMenu(this,'通话统计')">通话统计</div>
      <div class="nav-sub-item" id="report-billing" onclick="window.Nav.selectSubMenu(this,'计费统计')">计费统计</div>
      <div class="nav-sub-item" id="report-clue" onclick="window.Nav.selectSubMenu(this,'线索统计')">线索统计</div>
    </div>

    <div class="nav-item" id="nav-result" onclick="window.Nav.toggleMenu(this,'result')">
      <div class="nav-item-inner"><span class="label">外呼结果</span></div>
      <span class="arrow">▾</span>
    </div>
    <div class="nav-sub" id="sub-result">
      <div class="nav-sub-item" id="result-records" onclick="window.Nav.selectSubMenu(this,'通话记录')">通话记录</div>
      <div class="nav-sub-item" id="result-clue" onclick="window.Nav.selectSubMenu(this,'线索记录')">线索记录</div>
    </div>

    <div class="nav-item" id="nav-system" onclick="window.Nav.toggleMenu(this,'system')">
      <div class="nav-item-inner"><span class="label">系统管理</span></div>
      <span class="arrow">▾</span>
    </div>
    <div class="nav-sub" id="sub-system">
      <div class="nav-sub-item" id="sys-account" onclick="window.Nav.selectSubMenu(this,'账号管理')">账号管理</div>
      <div class="nav-sub-item" id="sys-tenant" onclick="window.Nav.selectSubMenu(this,'租户管理')">租户管理</div>
      <div class="nav-sub-item" id="sys-channel" onclick="window.Nav.selectSubMenu(this,'通道管理')">通道管理</div>
      <div class="nav-sub-item" id="sys-scene" onclick="window.Nav.selectSubMenu(this,'业务场景')">业务场景</div>
      <div class="nav-sub-item" id="sys-tags" onclick="window.Nav.selectSubMenu(this,'标签管理')">标签管理</div>
    </div>
  </aside>

  <div class="content-area" id="page-content" style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;background:#f0f2f5;"></div>
</div>

          <input type="text" class="login-input-field" id="loginUsername" placeholder="请输入账号" value="super-product">

<script>
  window.AnnotationConfig = {
    projectId: 'ai-call-unified-v1',
    dataVersion: '5',
    page: function () {
      var activeItem = document.querySelector('.nav-sub-item.active');
      if (activeItem && activeItem.id) return activeItem.id;
      var activeHome = document.querySelector('.nav-item.active');
      if (activeHome && activeHome.id) return activeHome.id === 'nav-home' ? 'home' : activeHome.id;
      return 'index';
    }
  };
</script>
